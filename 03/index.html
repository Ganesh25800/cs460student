<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera;
        var LASTOBJECT = null;
        var isScaling = false;
        var FLICKERING = false;
        var WIREFRAME = false;

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);



            renderer.domElement.onmousedown = function (e) {
                // Only place a torus when SHIFT + left mouse button is used
                if (!e.shiftKey || e.button !== 0) return;

                // Temporarily disable camera interaction
                controls.enabled = false;

                // Convert mouse coordinates to normalized device coordinates
                var mouse = new THREE.Vector2(
                    (e.clientX / window.innerWidth) * 2 - 1,
                    -(e.clientY / window.innerHeight) * 2 + 1
                );

                // Cast a ray from the camera onto the invisible placement plane
                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);

                var intersects = raycaster.intersectObject(invisible_plane);

                if (intersects.length === 0) return;

                // Create a NEW hotpink torus knot
                var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);

                var material = new THREE.MeshStandardMaterial({
                    color: 0xff69b4
                });

                var torus = new THREE.Mesh(geometry, material);

                torus.position.copy(intersects[0].point);

                scene.add(torus);
                LASTOBJECT = torus;
                isScaling = true;
            };

            renderer.domElement.onmousemove = function (e) {

                // Scale only while actively placing a torus
                // AND while the left mouse button is physically held.
                if (!isScaling || LASTOBJECT === null || (e.buttons & 1) === 0) {
                    return;
                }

                var delta = -e.movementY * 0.01;
                var newScale = LASTOBJECT.scale.x + delta;

                LASTOBJECT.scale.set(newScale, newScale, newScale);

                // Change color when the torus flips through zero
                if (newScale < 0) {
                    LASTOBJECT.material.color.set(0x7CFC00); // grassgreen
                } else {
                    LASTOBJECT.material.color.set(0xff69b4); // hotpink
                }
            };

            window.onmouseup = function () {
                isScaling = false;
                controls.enabled = true;
            };

            window.onkeydown = function (e) {

                var key = e.key.toLowerCase();

                if (key === "f") {
                    FLICKERING = !FLICKERING;
                }

                if (key === "w") {
                    WIREFRAME = !WIREFRAME;

                    scene.traverse(function (object) {
                        if (object.isMesh && object.material instanceof THREE.MeshStandardMaterial) {
                            object.material.wireframe = WIREFRAME;
                            object.material.needsUpdate = true;
                        }
                    });
                }
            };


            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);




            //
            // The invisible plane
            //
            var geometry = new THREE.PlaneGeometry(10000, 10000);
            var material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            if (FLICKERING) {
                scene.traverse(function (object) {
                    if (object.isMesh && object.material instanceof THREE.MeshStandardMaterial) {
                        object.material.transparent = true;
                        object.material.opacity = Math.random();
                        object.material.needsUpdate = true;
                    }

                });
            }
            // and here..
            controls.update();
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
